name: contribution-city

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: izviopm
        run: python3 scripts/contribution_city.py assets/contribution-city.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg
          git diff --cached --quiet || (git commit -m "Update contribution city" && git push)
